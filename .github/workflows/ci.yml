# Integração contínua: roda os testes automaticamente a cada push.
#
# Por que isso importa num portfólio? Porque mostra disciplina de engenharia.
# E porque o badge verde no README é uma prova viva de que o código funciona
# na máquina de outra pessoa, não só na sua.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      # Força o modo demonstração: nenhum teste precisa de chave de API
      # nem acessa a internet.
      AGENT_CREW_PROVIDER: mock
      AGENT_CREW_SEARCH_BACKEND: mock

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Rodar os testes
        run: pytest -q

      - name: Conferir se o CLI responde
        # Um teste de fumaça: garante que a instalação gerou os comandos.
        run: |
          agent-crew version
          agent-crew run "teste de fumaça" -q

      - name: Rodar os exemplos de aprendizagem
        # Se um exemplo quebrar, a documentação está mentindo.
        run: make examples

  lint:
    name: Estilo do código
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar o ruff
        run: pip install ruff

      - name: Verificar problemas
        run: ruff check src tests examples

      - name: Conferir a formatação
        run: ruff format --check src tests examples
